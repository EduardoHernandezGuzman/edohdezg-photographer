<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>OG card</title>
    <style>
      @font-face {
        font-family: "Bebas Neue";
        src: url("../fonts/bebas-neue-latin-400.woff2") format("woff2");
      }

      * {
        margin: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        background: #111;
        font-family: Georgia, serif;
      }

      .photo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: brightness(0.5);
      }

      .content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        height: 100%;
        padding: 0 80px;
        color: #ffffff;
      }

      h1 {
        font-family: "Bebas Neue", sans-serif;
        font-size: 180px;
        line-height: 1;
        letter-spacing: 0.02em;
      }

      .tagline {
        margin-top: 12px;
        font-size: 30px;
        opacity: 0.9;
      }

      .url {
        position: absolute;
        right: 80px;
        bottom: 44px;
        z-index: 1;
        color: #ffffff;
        font-size: 22px;
        letter-spacing: 0.06em;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <img class="photo" src="../img/opt/p009-1385.jpg" alt="" />
    <div class="content">
      <h1>EDOHDEZG</h1>
      <p class="tagline">Fotografía · Retrato, calle y desnudo artístico</p>
    </div>
    <p class="url">eduardohernandezguzman.github.io/edohdezg-photographer</p>
  </body>
</html>
